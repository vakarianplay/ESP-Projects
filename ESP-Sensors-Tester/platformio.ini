[platformio]
default_envs = esp32-c3-supermini

[common]
lib_deps =
    adafruit/Adafruit BME280 Library
    adafruit/Adafruit BMP280 Library
    adafruit/Adafruit Unified Sensor
    adafruit/DHT sensor library
    paulstoffregen/OneWire
    milesburton/DallasTemperature

; ============================================================
; ESP32-C3 Super Mini
; ============================================================

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D BOARD_ESP32_C3_SUPERMINI=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = ${common.lib_deps}

; ============================================================
; ESP32-WROOM-32 / ESP32 DevKit v1
; ============================================================

[env:esp32-wroom-32]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D BOARD_ESP32_WROOM32=1

lib_deps = ${common.lib_deps}

; ============================================================
; ESP32-S3
; ============================================================

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D BOARD_ESP32_S3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = ${common.lib_deps}

; ============================================================
; ESP32-S2
; ============================================================

[env:esp32-s2]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D BOARD_ESP32_S2=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = ${common.lib_deps}

; ============================================================
; ESP32-C6 DevKitC-1
; ============================================================

[env:esp32-c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -D BOARD_ESP32_C6=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = ${common.lib_deps}

; ============================================================
; ESP8266
; ============================================================

[esp8266_common]
platform = espressif8266
framework = arduino

monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0

lib_deps = ${common.lib_deps}

; ============================================================
; ESP8266 NodeMCU v2 / ESP-12E
; ============================================================

[env:esp8266-nodemcu]
extends = esp8266_common
board = nodemcuv2

; ============================================================
; Wemos D1 mini / D1 mini clone
; ============================================================

[env:esp8266-d1-mini]
extends = esp8266_common
board = d1_mini