[platformio]
default_envs = hub_debug

[env]
platform = espressif32@6.8.1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DESPNOW_CHANNEL=1

; =========================
; HUB 
; =========================

[env:hub_base]
board = esp32dev
build_src_filter = +<hub_main.cpp> -<cam_main.cpp>
build_flags =
    ${env.build_flags}

[env:hub_debug]
extends = env:hub_base
monitor_speed = 115200
build_flags =
    ${env:hub_base.build_flags}
    -DDEBUG_TEXT
    -DSERIAL_BAUD=115200

[env:hub_release]
extends = env:hub_base
monitor_speed = 921600
build_flags =
    ${env:hub_base.build_flags}
    -DSERIAL_BAUD=921600


[env:cam_base]
board = esp32cam
build_src_filter = +<cam_main.cpp> -<hub_main.cpp>
monitor_speed = 115200
upload_speed = 115200
build_flags =
    ${env.build_flags}
    -DCAPTURE_INTERVAL_MS=20000UL
    -DPRELIGHT_MS=500UL
    -DCAM_FB_COUNT=1
    -DFORCE_FRESH_FRAME
    -DRELEASE_FORCE_VGA
    -DRELEASE_JPEG_QUALITY=25
    -DHUB_MAC_0=0x01
    -DHUB_MAC_1=0x02
    -DHUB_MAC_2=0x03
    -DHUB_MAC_3=0x04
    -DHUB_MAC_4=0x05
    -DHUB_MAC_5=0x06

[env:cam1_release]
extends = env:cam_base
build_flags =
    ${env:cam_base.build_flags}
    -DCAM_ID=1

[env:cam2_release]
extends = env:cam_base
build_flags =
    ${env:cam_base.build_flags}
    -DCAM_ID=2

[env:cam3_release]
extends = env:cam_base
build_flags =
    ${env:cam_base.build_flags}
    -DCAM_ID=3

[env:cam4_release]
extends = env:cam_base
build_flags =
    ${env:cam_base.build_flags}
    -DCAM_ID=4

; DEBUG profiles:
[env:cam1_debug]
extends = env:cam_base
build_flags =
    ${env:cam_base.build_flags}
    -DCAM_ID=1
    -DDEBUG_TEXT
    -DCAPTURE_INTERVAL_MS=20000UL
    -DPRELIGHT_MS=500UL
    -DDEBUG_FORCE_VGA
    -DDEBUG_JPEG_QUALITY=25

[env:cam2_debug]
extends = env:cam1_debug
build_flags =
    ${env:cam1_debug.build_flags}
    -DCAM_ID=2

[env:cam3_debug]
extends = env:cam1_debug
build_flags =
    ${env:cam1_debug.build_flags}
    -DCAM_ID=3

[env:cam4_debug]
extends = env:cam1_debug
build_flags =
    ${env:cam1_debug.build_flags}
    -DCAM_ID=4
